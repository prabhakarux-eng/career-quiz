<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Career Path — Discovery Quiz for Classes 4 to 10</title>
<style>
  :root{
    --primary:#6C5CE7;
    --primary-light:#F3F0FF;
    --primary-border:#D4CFFF;
    --text:#1E1B2E;
    --text-soft:#6B6580;
    --text-muted:#9B95AE;
    --border:#E8E5F0;
    --card:#FFFFFF;
    --track-bg:#E5E3F0;
    --badge-bg:#EEEAFF;
    --wildcard-border:#F0D9A8;
    --wildcard-accent:#B8860B;
    --amber:#C77800;
    --amber-light:#FFF3E0;
    --green:#2E9E6C;
    --green-light:#E9F8F1;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(168deg,#F8F7FF 0%,#FFF8F0 50%,#F0F4FF 100%);
    color:var(--text);
  }
  .wrapper{ min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .container{ width:100%; max-width:520px; padding:0 20px; }
  .centered-full{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  h1,h2,h3,p{ margin:0; }
  .btn-primary{
    display:inline-block; padding:15px 40px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--primary),#8B7CF7); color:#fff;
    font-size:17px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 24px rgba(108,92,231,.3); letter-spacing:.01em;
    font-family:inherit;
  }
  .btn-primary.full{ width:100%; margin-top:8px; }
  .btn-primary.small{ padding:10px 22px; font-size:14px; box-shadow:none; }
  .link-btn{
    background:none; border:none; color:var(--text-muted); font-size:14px;
    font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
    font-family:inherit; padding:0;
  }
  .back-link{ text-decoration:none; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px; }
  .option{
    display:flex; align-items:center; gap:12px; padding:13px 16px; margin-bottom:10px;
    border-radius:14px; border:2px solid var(--border); background:var(--card);
    cursor:pointer; font-size:15px; line-height:1.4; transition:all .15s ease; user-select:none;
  }
  .option.selected{ border-color:var(--primary); background:var(--primary-light); font-weight:600; color:#4A3D8F; }
  .radio{ width:20px; height:20px; min-width:20px; border-radius:50%; border:2px solid #C5C0D8; background:#fff; }
  .radio.selected{ border:6px solid var(--primary); }
  .checkbox{
    width:20px; height:20px; min-width:20px; border-radius:6px; border:2px solid #C5C0D8; background:#fff;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700;
  }
  .checkbox.selected{ border:none; background:var(--primary); }
  .rank-badge{
    width:24px; height:24px; min-width:24px; border-radius:50%; border:2px solid #C5C0D8;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700;
  }
  .rank-badge.selected{ border:none; background:var(--primary); }
  .confirm-btn{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    width:calc(100% - 40px); max-width:480px; padding:15px 24px; border-radius:14px; border:none;
    background:var(--track-bg); color:#A09BB3; font-size:16px; font-weight:700;
    cursor:default; transition:all .2s ease; z-index:20; font-family:inherit;
  }
  .confirm-btn.active{ background:linear-gradient(135deg,var(--primary),#8B7CF7); color:#fff; cursor:pointer; box-shadow:0 4px 20px rgba(108,92,231,.3); }
  .progress-bar{
    position:sticky; top:0; z-index:10; background:rgba(248,247,255,.92); backdrop-filter:blur(10px);
    padding:14px 20px 10px; max-width:520px; width:100%;
  }
  .progress-track{ height:4px; border-radius:2px; background:var(--track-bg); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:2px; background:linear-gradient(90deg,var(--primary),#A87BFF); transition:width .4s ease; }
  .progress-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px; color:var(--text-muted); font-weight:500; }
  .section-badge{
    display:inline-flex; align-items:center; gap:5px; background:var(--badge-bg); padding:3px 10px;
    border-radius:20px; font-size:11px; font-weight:600; color:var(--primary); text-transform:uppercase; letter-spacing:.06em;
  }
  .pill{ display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500; margin:3px 4px 3px 0; }
  .pill-green{ background:var(--green-light); color:var(--green); font-weight:600; }
  .pill-purple{ background:var(--primary-light); color:var(--primary); }
  .pill-amber{ background:var(--amber-light); color:var(--amber); }
  .detail-label{ font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin:0 0 5px; }
  .result-card{
    display:flex; align-items:center; gap:14px; background:var(--card); border-radius:16px;
    padding:16px 18px; margin-bottom:12px; border:2px solid var(--border); cursor:pointer; transition:all .2s ease;
  }
  .result-card:hover{ border-color:var(--primary-border); }
  .result-card.wildcard{ background:linear-gradient(135deg,#FFFBF0,#FFF5E6); border-color:var(--wildcard-border); }
  .badge-match{ display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:4px; background:var(--badge-bg); color:var(--primary); }
  .badge-match.wildcard{ background:#FFF0D4; color:var(--wildcard-accent); }
  .reason-box{ background:var(--primary-light); border-radius:14px; padding:14px 16px; margin-bottom:16px; }
  .reason-box p.reason-title{ font-size:11px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px; }
  .reason-box p.reason-line{ font-size:13.5px; color:#4A3D8F; margin:4px 0; line-height:1.5; }
  .funfact-box{ background:linear-gradient(135deg,#FFFBF0,#FFF5E6); border-radius:14px; padding:14px 16px; margin-bottom:20px; border:1px solid var(--wildcard-border); }
  .funfact-box p.funfact-title{ font-size:11px; font-weight:700; color:var(--wildcard-accent); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
  .funfact-box p.funfact-body{ font-size:13.5px; color:#6B5420; line-height:1.5; margin:0; }
  .detail-hero{ text-align:center; padding:28px 20px; border-radius:20px; margin-bottom:20px; background:var(--primary-light); border:2px solid var(--primary-border); }
  .detail-hero.wildcard{ background:linear-gradient(135deg,#FFFBF0,#FFF5E6); border-color:var(--wildcard-border); }
  .detail-hero .hero-badge{ display:inline-block; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px; background:#fff; color:var(--primary); }
  .detail-hero.wildcard .hero-badge{ background:#FFF0D4; color:var(--wildcard-accent); }
  .nav-row{ display:flex; justify-content:space-between; gap:10px; margin-top:8px; }
  .nav-btn{ flex:1; padding:12px 10px; border-radius:12px; border:2px solid var(--border); background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:var(--text); font-family:inherit; }
  .nav-btn:disabled{ color:var(--text-muted); opacity:.5; cursor:default; }
  .nav-btn.next{ border:none; background:linear-gradient(135deg,var(--primary),#8B7CF7); color:#fff; }
  .nav-btn.next:disabled{ background:var(--track-bg); color:var(--text-muted); }
  .action-row{ text-align:center; margin-top:20px; display:flex; justify-content:center; gap:18px; }
  .mute-btn{
    position:fixed; top:14px; right:14px; z-index:50; width:42px; height:42px; border-radius:50%;
    border:2px solid var(--border); background:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .report-header{ display:flex; justify-content:space-between; align-items:center; padding:20px 0; }
  .report-hint{ font-size:12.5px; color:var(--text-muted); margin:-8px 0 16px; line-height:1.5; }
  .report-title{ text-align:center; padding:12px 0 28px; border-bottom:2px solid var(--border); margin-bottom:24px; }
  .qa-block{ margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .qa-block p.qa-meta{ font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 3px; }
  .qa-block p.qa-q{ font-size:14px; font-weight:600; margin:0 0 4px; }
  .qa-block p.qa-a{ font-size:13.5px; color:#3D3652; margin:0; }
  .career-block{ margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border); break-inside:avoid; }
  .career-block:last-child{ border-bottom:none; }
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff !important; }
  }
</style>
</head>

function computeResults(answers) {
  const scores = {};
  ROLE_KEYS.forEach((r) => { scores[r] = 0; });

  Object.entries(answers).forEach(([qId, answer]) => {
    const question = QUESTIONS.find((q) => q.id === qId);
    if (!question) return;

    const processOpt = (opt, weight) => {
      if (opt.scores) {
        Object.entries(opt.scores).forEach(([role, pts]) => {
          scores[role] = (scores[role] || 0) + pts * weight;
        });
      }
      if (opt.anti) {
        opt.anti.forEach((role) => { scores[role] = (scores[role] || 0) - 2; });
      }
    };

    if (question.type === "single" && typeof answer === "number") {
      const opt = question.options[answer];
      if (opt) processOpt(opt, 1);
    } else if (question.type === "multi" && Array.isArray(answer)) {
      answer.forEach((idx) => {
        const opt = question.options[idx];
        if (opt) processOpt(opt, 1);
      });
    } else if (question.type === "rank" && Array.isArray(answer)) {
      answer.forEach((idx, rank) => {
        const opt = question.options[idx];
        const weight = rank === 0 ? 1.5 : rank === 1 ? 1 : 0.6;
        if (opt) processOpt(opt, weight);
      });
    }
  });

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  // Top 4 best matches + 1 wildcard (5th-highest, framed as "worth a look")
  const topRoles = sorted.slice(0, 4).map(([key, score]) => ({
    key, score, ...ROLES[key], isWildcard: false,
  }));
  if (sorted.length > 4) {
    const wc = sorted[4];
    topRoles.push({ key: wc[0], score: wc[1], ...ROLES[wc[0]], isWildcard: true });
  }
  return topRoles;
}

// Turns a stored answer (index, array of indices, or ranked array) back
// into a readable label for the printable report.
function formatAnswer(question, answer) {
  if (answer === undefined || answer === null) return "Skipped";
  if (question.type === "single" && typeof answer === "number") {
    const opt = question.options[answer];
    return opt ? opt.label : "Skipped";
  }
  if (question.type === "multi" && Array.isArray(answer)) {
    return answer
      .map((idx) => question.options[idx] && question.options[idx].label)
      .filter(Boolean)
      .join("; ");
  }
  if (question.type === "rank" && Array.isArray(answer)) {
    return answer
      .map((idx, i) => {
        const opt = question.options[idx];
        return opt ? (i + 1) + ". " + opt.label : null;
      })
      .filter(Boolean)
      .join("  ");
  }
  return "Skipped";
}


// ══════════════════════════════════════════════════════════
// Sound effects — generated with the Web Audio API, so no
// external audio files are needed and the file works fully offline.
// ══════════════════════════════════════════════════════════
let audioCtx = null;
let soundsMuted = false;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone(freq, duration, opts) {
  if (soundsMuted) return;
  opts = opts || {};
  const type = opts.type || "sine";
  const startTime = opts.startTime || 0;
  const peak = opts.peak != null ? opts.peak : 0.12;
  try {
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + startTime;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  } catch (e) { /* audio not available — fail silently */ }
}

const SFX = {
  click: () => tone(700, 0.07, { type: "triangle", peak: 0.1 }),
  selectOn: () => tone(784, 0.09, { type: "sine", peak: 0.1 }),
  selectOff: () => tone(392, 0.08, { type: "sine", peak: 0.08 }),
  confirm: () => { tone(523, 0.1, { type: "sine", peak: 0.11 }); tone(659, 0.13, { type: "sine", startTime: 0.09, peak: 0.11 }); },
  back: () => { tone(659, 0.09, { type: "sine", peak: 0.09 }); tone(494, 0.11, { type: "sine", startTime: 0.07, peak: 0.09 }); },
  sectionDone: () => {
    tone(523, 0.12, { type: "sine", peak: 0.1 });
    tone(659, 0.12, { type: "sine", startTime: 0.1, peak: 0.1 });
    tone(784, 0.16, { type: "sine", startTime: 0.2, peak: 0.1 });
  },
  reveal: () => {
    tone(523, 0.14, { type: "triangle", peak: 0.12 });
    tone(659, 0.14, { type: "triangle", startTime: 0.11, peak: 0.12 });
    tone(784, 0.14, { type: "triangle", startTime: 0.22, peak: 0.12 });
    tone(1047, 0.28, { type: "triangle", startTime: 0.33, peak: 0.13 });
  },
  cardOpen: () => tone(880, 0.11, { type: "sine", peak: 0.1 }),
  toggleOn: () => tone(660, 0.08, { type: "sine", peak: 0.08 }),
  toggleOff: () => tone(440, 0.08, { type: "sine", peak: 0.06 }),
};

function toggleMute() {
  soundsMuted = !soundsMuted;
  const btn = document.getElementById("muteBtn");
  btn.textContent = soundsMuted ? "🔇" : "🔊";

const state = {
  screen: "welcome", // welcome | transition | quiz | results | detail | report
  qIndex: 0,
  answers: {},

  rankSel: [],

  detailIndex: 0,
};

function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function currentQuestion() { return QUESTIONS[state.qIndex] || null; }
function currentSection() { const q = currentQuestion(); return q ? SECTIONS[q.section] : null; }

function getMatchReasons(role) {
  const r = [];
  const findQ = (id) => QUESTIONS.find((qq) => qq.id === id);

  const topicsQ = findQ("curiosity_topics");
  const topics = state.answers.curiosity_topics;
  if (Array.isArray(topics) && topicsQ) {
    topics.forEach((idx) => {
      const opt = topicsQ.options[idx];
      if (opt && opt.scores && opt.scores[role.key]) r.push("You're drawn to: " + opt.label.toLowerCase());
    });
  }
  const wpQ = findQ("word_pair");
  const wp = state.answers.word_pair;
  if (typeof wp === "number" && wpQ && wpQ.options[wp]) {
    const opt = wpQ.options[wp];
    if (opt.scores && opt.scores[role.key]) r.push("You describe yourself as: " + opt.label);
  }
  const gcQ = findQ("gut_check");
  const gc = state.answers.gut_check;
  if (typeof gc === "number" && gcQ && gcQ.options[gc]) {
    const opt = gcQ.options[gc];
    if (opt.scores && opt.scores[role.key]) r.push("Your gut check: " + opt.label.toLowerCase());
  }
  const shadowQ = findQ("shadow");
  const shadow = state.answers.shadow;
  if (Array.isArray(shadow) && shadowQ && r.length < 3) {
    shadow.forEach((idx) => {
      const opt = shadowQ.options[idx];
      if (opt && opt.scores && opt.scores[role.key]) r.push("You'd want to shadow: " + opt.label.toLowerCase());
    });
  }
  return r.slice(0, 3);
}

// ── Navigation ──
function navigateToQuestion(idx) {
  const target = QUESTIONS[idx];
  if (target) {
    const prior = state.answers[target.id];
    state.multiSel = target.type === "multi" && Array.isArray(prior) ? prior.slice() : [];
    state.rankSel = target.type === "rank" && Array.isArray(prior) ? prior.slice() : [];
  }
  state.qIndex = idx;
  state.screen = "quiz";
  render();
}

function goNext() {
  const q = currentQuestion();
  const nextIdx = state.qIndex + 1;
  if (nextIdx >= QUESTIONS.length) {
    state.results = computeResults(state.answers);
    SFX.reveal();
    state.screen = "results";
    render();
    return;
  }
  const nextQ = QUESTIONS[nextIdx];
  if (nextQ.section !== q.section) {
    SFX.sectionDone();
    state.screen = "transition";
    render();
  } else {
    navigateToQuestion(nextIdx);
  }
}

function goBack() {
  if (state.qIndex <= 0) return;
  SFX.back();
  navigateToQuestion(state.qIndex - 1);
}

function handleSingle(idx) {
  const q = currentQuestion();
  state.answers = Object.assign({}, state.answers, { [q.id]: idx });
  SFX.click();
  render(); // show selection instantly
  setTimeout(goNext, 250);
}

function toggleMulti(idx) {
  const q = currentQuestion();
  const pos = state.multiSel.indexOf(idx);
  if (pos >= 0) { state.multiSel.splice(pos, 1); SFX.selectOff(); }
  else {
    if (state.multiSel.length >= (q.max || 2)) return;
    state.multiSel.push(idx);
    SFX.selectOn();
  }
  render();
}

function confirmMulti() {
  const q = currentQuestion();
  if (state.multiSel.length === 0) return;
  state.answers = Object.assign({}, state.answers, { [q.id]: state.multiSel.slice() });
  state.multiSel = [];
  SFX.confirm();
  goNext();
}

function toggleRank(idx) {
  const q = currentQuestion();
  const pos = state.rankSel.indexOf(idx);
  if (pos >= 0) { state.rankSel.splice(pos, 1); SFX.selectOff(); }
  else {
    if (state.rankSel.length >= (q.max || 3)) return;
    state.rankSel.push(idx);
    SFX.selectOn();
  }
  render();
}

function confirmRank() {
  const q = currentQuestion();
  const needed = q.max || 3;
  if (state.rankSel.length < needed) return;
  state.answers = Object.assign({}, state.answers, { [q.id]: state.rankSel.slice() });
  state.rankSel = [];
  SFX.confirm();
  goNext();
}

function continueFromTransition() {
  const q = currentQuestion();
  const nextIdx = QUESTIONS.findIndex((qq, i) => i > state.qIndex && qq.section !== q.section);
  const target = nextIdx >= 0 ? nextIdx : state.qIndex + 1;
  SFX.click();
  navigateToQuestion(target);
}

function backFromTransition() {
  SFX.back();
  navigateToQuestion(state.qIndex);
}

function restart() {
  state.screen = "welcome";
  state.qIndex = 0;
  state.answers = {};
  state.results = null;
  state.detailIndex = 0;
  state.multiSel = [];
  state.rankSel = [];
  SFX.click();
  render();
}

function editAnswers() {
  navigateToQuestion(QUESTIONS.length - 1);
}

function openDetail(i) {
  state.detailIndex = i;
  SFX.cardOpen();
  state.screen = "detail";
  render();
}

function backToResults() {
  SFX.back();
  state.screen = "results";
  render();
}

function openReport() {
  SFX.confirm();
  state.screen = "report";
  render();
}

function startQuiz() {
  SFX.confirm();
  state.qIndex = 0;
  state.screen = "quiz";

}

    '<button class="nav-btn next" data-action="next-detail" ' + (hasNext ? '' : 'disabled') + '>Next →</button>' +
    '</div>' +
    '<div class="action-row"><button class="link-btn" data-action="open-report">Download PDF report</button><button class="link-btn" data-action="restart">Retake quiz</button></div>' +
    '</div></div></div>'
  );
}

function renderReport() {
  const results = state.results;
  const answeredQuestions = QUESTIONS.filter((qq) => state.answers[qq.id] !== undefined);
  const today = new Date().toLocaleDateString("en-IN", { year: "numeric", month: "long", day: "numeric" });

  let answersHtml = "";
  answeredQuestions.forEach((qq, i) => {
    answersHtml += (
      '<div class="qa-block"><p class="qa-meta">Q' + (i + 1) + ' · ' + esc(SECTIONS[qq.section].title) + '</p>' +
      '<p class="qa-q">' + esc(qq.text) + '</p>' +
      '<p class="qa-a">' + esc(formatAnswer(qq, state.answers[qq.id])) + '</p></div>'
    );
  });

  let careersHtml = "";
  results.forEach((role, i) => {
    const reasons = getMatchReasons(role);
    careersHtml += (
      '<div class="career-block"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
      '<div style="font-size:30px;">' + role.emoji + '</div><div>' +
      '<span class="badge-match' + (role.isWildcard ? ' wildcard' : '') + '">' + (role.isWildcard ? 'Wildcard' : ('#' + (i + 1) + ' Match')) + '</span>' +
      '<h3 style="font-size:18px;font-weight:800;margin-top:3px;">' + esc(role.title) + '</h3></div></div>' +
      (reasons.length ? '<p style="font-size:12.5px;color:#4A3D8F;margin-bottom:8px;line-height:1.5;"><strong>Why this fits you:</strong> ' + esc(reasons.join(' · ')) + '</p>' : '') +
      '<div style="margin-bottom:12px;"><p class="detail-label">What you\'d actually do</p><p style="font-size:13px;color:#3D3652;">' + esc(role.desc) + '</p></div>' +
      '<div style="margin-bottom:12px;"><p class="detail-label">A day in the life</p><p style="font-size:13px;color:#3D3652;">' + esc(role.daylife) + '</p></div>' +
      '<p class="detail-label">Subjects that matter now</p><p style="font-size:13px;color:#3D3652;margin-bottom:10px;">' + esc(role.subjects.join(', ')) + '</p>' +
      '<p class="detail-label">Signs you\'re already a fit</p><p style="font-size:13px;color:#3D3652;margin-bottom:10px;">' + esc(role.skills.join(', ')) + '</p>' +
      '<p class="detail-label">Worth building from now</p><p style="font-size:13px;color:#3D3652;margin-bottom:10px;">' + esc(role.grow.join(', ')) + '</p>' +
      '<div style="margin-bottom:12px;"><p class="detail-label">A possible path forward (India)</p><p style="font-size:13px;color:#3D3652;">' + esc(role.path) + '</p></div>' +
      '<div><p class="detail-label">Good to know</p><p style="font-size:13px;color:#3D3652;">' + esc(role.funfact) + '</p></div>' +
      '</div>'
    );
  });

  return (
    '<div class="wrapper" style="background:#fff;"><div style="width:100%;max-width:720px;padding:0 24px;">' +
    '<div class="report-header no-print">' +
    '<button class="link-btn" data-action="back-results" style="text-decoration:none;">← Back to results</button>' +
    '<button class="btn-primary small" data-action="print-report">🖨️ Print / Save as PDF</button>' +
    '</div>' +
    '<p class="report-hint no-print">In the print dialog, choose <strong>"Save as PDF"</strong> as the destination to download this report.</p>' +
    '<div class="report-title"><div style="font-size:40px;margin-bottom:8px;">🧭</div>' +
    '<h1 style="font-size:24px;font-weight:800;margin-bottom:6px;">My Career Discovery Report</h1>' +
    '<p style="font-size:13px;color:var(--text-muted);">Generated on ' + esc(today) + '</p></div>' +
    '<h2 style="font-size:17px;font-weight:800;margin-bottom:12px;">My Answers</h2>' +
    answersHtml +
    '<h2 style="font-size:17px;font-weight:800;margin:32px 0 12px;">My 5 Suggested Careers</h2>' +
    careersHtml +
    '<div class="no-print" style="text-align:center;padding:8px 0 40px;"><button class="link-btn" data-action="back-results">← Back to results</button></div>' +
    '</div></div>'
  );
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "welcome") app.innerHTML = renderWelcome();
  else if (state.screen === "transition") app.innerHTML = renderTransition();
  else if (state.screen === "quiz") app.innerHTML = renderQuiz();
  else if (state.screen === "results") app.innerHTML = renderResults();
  else if (state.screen === "detail") app.innerHTML = renderDetail();
  else if (state.screen === "report") app.innerHTML = renderReport();
  window.scrollTo(0, 0);
}

// ── Event delegation: one listener handles every screen ──
document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  const idx = el.dataset.idx !== undefined ? parseInt(el.dataset.idx, 10) : null;

  switch (action) {
    case "start-quiz": startQuiz(); break;
    case "select-single": handleSingle(idx); break;
    case "toggle-multi": toggleMulti(idx); break;
    case "confirm-multi": confirmMulti(); break;
    case "toggle-rank": toggleRank(idx); break;
    case "confirm-rank": confirmRank(); break;
    case "continue-transition": continueFromTransition(); break;
    case "back-transition": backFromTransition(); break;
    case "go-back": goBack(); break;
    case "restart": restart(); break;
    case "edit-answers": editAnswers(); break;
    case "open-detail": openDetail(idx); break;
    case "back-results": backToResults(); break;
    case "prev-detail": if (state.detailIndex > 0) openDetail(state.detailIndex - 1); break;
    case "next-detail": if (state.detailIndex < state.results.length - 1) openDetail(state.detailIndex + 1); break;
    case "open-report": openReport(); break;
    case "print-report": window.print(); break;
  }
});

document.getElementById("muteBtn").addEventListener("click", toggleMute);

render();
</script>
</body>
</html>
